# Déploiement en production sur push vers `main`.
#
# Un seul job, là où `charge-app` en enchaîne trois : il n'y a ici ni règles
# Firestore à tester puis publier avant le site, ni la moindre variable
# d'environnement — l'application n'utilise pas le SDK Firebase, Firebase ne sert
# qu'à héberger. Seul le compte de service est nécessaire.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

# Le workflow ne fait qu'un checkout : rien ne justifie les permissions par défaut
# du dépôt.
permissions:
  contents: read

# Deux pushes rapprochés se déploieraient sinon en parallèle et pourraient se
# croiser. Sans annulation : un déploiement interrompu à mi-parcours est pire que
# de l'attendre.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées sur un SHA complet, jamais sur un tag. Un tag est mutable :
      # qui contrôle le dépôt d'une action peut le repointer, et le job suivant lui
      # remet `FIREBASE_SERVICE_ACCOUNT` — de quoi défigurer le site et servir un
      # service worker empoisonné aux PWA déjà installées.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sans ça, `GITHUB_TOKEN` reste dans `.git/config` pendant `npm ci` et le
          # build. Aucune étape ne pousse : le garder ne sert à rien.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # `npm ci` déclenche `postinstall: nuxt prepare`, qui génère
      # `.nuxt/eslint.config.mjs` dont dépend `eslint.config.mjs` : d'où l'ordre.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # `generate` et jamais `build` : `build` produit un serveur Nitro et laisse
      # `.output/public` sans le moindre HTML. C'est l'erreur qui met en ligne un
      # site vide sans qu'aucune étape n'échoue.
      - run: npm run generate

      # `projectId` explicite : l'action sait l'inférer de `.firebaserc`, mais le
      # compte de service peut avoir accès à plusieurs projets et l'inférence est
      # alors silencieusement ambiguë.
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: trace-app-decalque
          channelId: live
